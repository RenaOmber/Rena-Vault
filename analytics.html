<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RO Vault" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rena Omber — Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060f0a; --bg2: #0d1f14; --bg3: #122b1a; --bg4: #0a1910;
      --border: rgba(52,211,153,0.1); --border-hover: rgba(52,211,153,0.26);
      --text: #e6f4ec; --text2: #7aab90; --text3: #3d6b52;
      --green: #34d399; --green-dim: rgba(52,211,153,0.1);
      --yellow: #fbbf24; --yellow-dim: rgba(251,191,36,0.1);
      --red: #f87171; --red-dim: rgba(248,113,113,0.1);
      --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.1);
      --mono: 'JetBrains Mono', monospace;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; min-height: 100vh; }

    /* GATE */
    #gate { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .gate-mark { width: 40px; height: 4px; background: var(--green); border-radius: 2px; margin: 0 auto 16px; }
    .gate-form { display: flex; gap: 8px; margin-top: 8px; }
    .gate-form input { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 14px; padding: 10px 14px; width: 220px; outline: none; }
    .gate-form button { background: var(--green); border: none; border-radius: 6px; color: #04150c; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px 18px; }
    .gate-error { font-size: 12px; color: var(--red); min-height: 16px; text-align: center; }

    /* LAYOUT */
    #main { display: none; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(6,15,10,0.94); backdrop-filter: blur(12px); z-index: 10; }
    .top-left { display: flex; align-items: center; gap: 10px; }
    .top-mark { width: 22px; height: 3px; background: var(--green); border-radius: 2px; }
    .top-name { font-size: 13px; font-weight: 600; }
    .top-sub { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
    .top-right { display: flex; gap: 8px; align-items: center; }
    .btn-ghost { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 12px; padding: 6px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: border-color 0.15s; }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

    .content { padding: 32px 36px; max-width: 1100px; margin: 0 auto; }

    /* HERO STATS */
    .hero-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
    .hero-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; position: relative; overflow: hidden; }
    .hero-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .hero-card.revenue::before { background: linear-gradient(90deg, var(--green), transparent); }
    .hero-card.units::before { background: linear-gradient(90deg, var(--yellow), transparent); }
    .hero-card.avg::before { background: linear-gradient(90deg, var(--purple), transparent); }
    .hero-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .hero-value { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .hero-value.revenue { color: var(--green); }
    .hero-value.units { color: var(--yellow); }
    .hero-value.avg { color: var(--purple); }
    .hero-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
    .hero-delta { font-size: 11px; font-weight: 600; margin-top: 4px; }
    .delta-up { color: var(--green); }
    .delta-down { color: var(--red); }

    /* CONTROLS */
    .controls-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .ctrl-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
    .ctrl-btn { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 12px; padding: 6px 14px; transition: all 0.15s; }
    .ctrl-btn:hover, .ctrl-btn.active { background: var(--green-dim); border-color: rgba(52,211,153,0.3); color: var(--green); }
    .ctrl-select { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 12px; padding: 6px 12px; outline: none; margin-left: auto; }

    /* CHART */
    .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 28px; }
    .chart-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .chart-legend { display: flex; gap: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .chart-wrap { overflow-x: auto; }
    .chart-svg { display: block; }

    /* BAR CHART */
    .bar-group:hover .bar-revenue { opacity: 0.85; }
    .bar-group:hover .bar-units { opacity: 0.85; }
    .chart-tooltip { position: fixed; background: var(--bg3); border: 1px solid var(--border-hover); border-radius: 8px; padding: 10px 14px; font-size: 12px; pointer-events: none; z-index: 50; opacity: 0; transition: opacity 0.12s; min-width: 160px; }
    .chart-tooltip.show { opacity: 1; }
    .tt-month { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 12px; }
    .tt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 3px; }
    .tt-label { color: var(--text3); }
    .tt-val { font-family: var(--mono); font-weight: 600; }

    /* TABLE */
    .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; }
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; text-align: left; padding: 10px 20px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap; }
    thead th.right { text-align: right; }
    tbody td { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
    tbody td.right { text-align: right; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg3); }
    tfoot td { padding: 12px 20px; font-size: 12px; font-weight: 600; border-top: 1px solid var(--border); }
    tfoot td.right { text-align: right; }
    .mono { font-family: var(--mono); }
    .tag-artikel { font-size: 10px; background: var(--bg3); color: var(--text2); border-radius: 4px; padding: 2px 7px; display: inline-block; }
    .bar-mini { height: 3px; border-radius: 2px; background: var(--green); margin-top: 4px; transition: width 0.4s; }

    /* LOADING / EMPTY */
    .loading { text-align: center; padding: 60px; color: var(--text3); font-size: 13px; }
    .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }

    @media (max-width: 720px) {
      .content { padding: 16px; }
      .hero-row { grid-template-columns: 1fr; gap: 10px; }
      .top-bar { padding: 10px 14px; }
      thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

<div id="gate">
  <div>
    <div class="gate-mark"></div>
    <div style="font-size:18px;font-weight:500;text-align:center;">Rena Omber</div>
    <div style="font-size:12px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;text-align:center;margin-top:4px;">Analytics</div>
  </div>
  <div>
    <div class="gate-form">
      <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()" />
      <button onclick="checkPw()">Masuk</button>
    </div>
    <div class="gate-error" id="pw-error"></div>
  </div>
</div>

<div id="main">
  <div class="top-bar">
    <div class="top-left">
      <div class="top-mark"></div>
      <div>
        <div class="top-name">Rena Omber</div>
        <div class="top-sub">Analytics</div>
      </div>
    </div>
    <div class="top-right">
      <button class="theme-toggle-btn btn-ghost" onclick="toggleTheme()">☀️</button>
      <a href="sales.html" class="btn-ghost">Penjualan</a>
      <a href="index.html" class="btn-ghost">← Vault</a>
      <button class="btn-ghost" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="content">
    <div id="hero-row" class="hero-row">
      <div class="hero-card revenue">
        <div class="hero-label">Total Revenue</div>
        <div class="hero-value revenue" id="hero-revenue">—</div>
        <div class="hero-sub" id="hero-revenue-sub">memuat...</div>
      </div>
      <div class="hero-card units">
        <div class="hero-label">Total Unit Terjual</div>
        <div class="hero-value units" id="hero-units">—</div>
        <div class="hero-sub" id="hero-units-sub">memuat...</div>
      </div>
      <div class="hero-card avg">
        <div class="hero-label">Avg Revenue / Bulan</div>
        <div class="hero-value avg" id="hero-avg">—</div>
        <div class="hero-sub" id="hero-avg-sub">memuat...</div>
      </div>
    </div>

    <div class="controls-row">
      <span class="ctrl-label">Filter:</span>
      <button class="ctrl-btn active" onclick="setFilter('all', this)">Semua Produk</button>
      <div id="product-filters"></div>
      <select class="ctrl-select" id="year-select" onchange="render()">
        <option value="all">Semua Tahun</option>
      </select>
    </div>

    <div class="chart-card">
      <div class="chart-title">
        <span>Monthly Sales & Revenue</span>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div> Revenue</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--yellow);"></div> Unit Terjual</div>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="loading">Memuat data...</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <div class="table-title">Rincian Per Bulan</div>
      </div>
      <div id="table-wrap">
        <div class="loading">Memuat data...</div>
      </div>
    </div>
  </div>
</div>

<div class="chart-tooltip" id="tooltip"></div>

<script>
  const SUPABASE_URL  = 'https://fqvfnohhilkzvijqukfg.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdmZub2hoaWxrenZpanF1a2ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDU4NjAsImV4cCI6MjA5ODEyMTg2MH0.er10SEsmDlnx1yRLGJK2fKtLhQR40vFOXVJzH9yakCg';
  const PASSWORD_HASH = '3f0e57f3e719957119f0ba621629a3ae0ed1ec95d1ad8a91bd980b2896b679e4';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const SIZES = ['S','M','L','XL','XXL'];

  let allProducts = [], allTx = [], financeData = {};
  let activeFilter = 'all';

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function checkPw() {
    const val = document.getElementById('pw-input').value.trim();
    if ((await sha256(val)) === PASSWORD_HASH) {
      sessionStorage.setItem('ro_auth','1');
      showMain();
    } else {
      document.getElementById('pw-error').textContent = 'Password salah.';
      document.getElementById('pw-input').value = '';
    }
  }
  function logout() { sessionStorage.removeItem('ro_auth'); location.reload(); }
  async function showMain() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    await loadAll();
  }
  if (sessionStorage.getItem('ro_auth') === '1') showMain();

  function artikelUnits(a) { return SIZES.reduce((s,sz)=>s+(parseInt(a.sizes[sz])||0),0); }

  async function loadAll() {
    const [prodRes, txRes, finRes] = await Promise.all([
      sb.from('products').select('*').order('created_at'),
      sb.from('sales_transactions').select('*').order('sold_at'),
      sb.from('finance_entries').select('batch_key,harga_jual')
    ]);
    allProducts = (prodRes.data||[]).map(r=>({ id:String(r.id), name:r.name, batches:r.data?.batches||[] }));
    allTx = txRes.data||[];
    financeData = {};
    (finRes.data||[]).forEach(r => { financeData[r.batch_key] = r; });

    buildProductFilters();
    buildYearFilter();
    render();
  }

  function buildProductFilters() {
    const el = document.getElementById('product-filters');
    el.innerHTML = allProducts.map(p =>
      `<button class="ctrl-btn" onclick="setFilter('${p.id}', this)">${p.name}</button>`
    ).join('');
  }

  function buildYearFilter() {
    const years = [...new Set(allTx.map(t => t.sold_at?.slice(0,4)).filter(Boolean))].sort();
    const sel = document.getElementById('year-select');
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      sel.appendChild(opt);
    });
  }

  function setFilter(val, btn) {
    activeFilter = val;
    document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function getHargaJual(prodId, batchIdx, artikelName) {
    const key = `${prodId}_${batchIdx}`;
    return parseInt(financeData[key]?.harga_jual?.[artikelName]) || 0;
  }

  function buildMonthlyData() {
    const yearFilter = document.getElementById('year-select').value;
    let txFiltered = allTx;
    if (activeFilter !== 'all') txFiltered = txFiltered.filter(t => t.product_id === activeFilter);
    if (yearFilter !== 'all') txFiltered = txFiltered.filter(t => t.sold_at?.startsWith(yearFilter));

    const map = {};
    txFiltered.forEach(t => {
      const month = t.sold_at?.slice(0,7); // YYYY-MM
      if (!month) return;
      if (!map[month]) map[month] = { units: 0, revenue: 0, byArtikel: {} };
      const harga = getHargaJual(t.product_id, t.batch_idx, t.artikel_name);
      const rev = harga * t.qty;
      map[month].units += t.qty;
      map[month].revenue += rev;
      if (!map[month].byArtikel[t.artikel_name]) map[month].byArtikel[t.artikel_name] = { units: 0, revenue: 0 };
      map[month].byArtikel[t.artikel_name].units += t.qty;
      map[month].byArtikel[t.artikel_name].revenue += rev;
    });

    // fill gaps between first and last month
    const keys = Object.keys(map).sort();
    if (!keys.length) return [];
    let cur = keys[0];
    const last = keys[keys.length-1];
    while (cur <= last) {
      if (!map[cur]) map[cur] = { units: 0, revenue: 0, byArtikel: {} };
      const [y,m] = cur.split('-').map(Number);
      const next = m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
      cur = next;
    }
    return Object.keys(map).sort().map(k => ({ month: k, ...map[k] }));
  }

  const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
  function fmtMonth(ym) {
    const [y,m] = ym.split('-');
    return `${BULAN[parseInt(m)-1]} ${y}`;
  }
  function fmt(n) { return 'Rp ' + (parseInt(n)||0).toLocaleString('id-ID'); }
  function fmtShort(n) {
    n = parseInt(n)||0;
    if (n >= 1000000) return 'Rp ' + (n/1000000).toFixed(1).replace('.0','') + 'jt';
    if (n >= 1000) return 'Rp ' + (n/1000).toFixed(0) + 'rb';
    return 'Rp ' + n;
  }

  function render() {
    const data = buildMonthlyData();
    renderHero(data);
    renderChart(data);
    renderTable(data);
  }

  function renderHero(data) {
    const totalRev = data.reduce((s,d)=>s+d.revenue,0);
    const totalUnits = data.reduce((s,d)=>s+d.units,0);
    const activeMonths = data.filter(d=>d.units>0).length;
    const avgRev = activeMonths ? Math.round(totalRev/activeMonths) : 0;

    // delta vs previous month
    const last = data[data.length-1];
    const prev = data[data.length-2];
    let deltaHtml = '';
    if (last && prev && prev.revenue > 0) {
      const pct = Math.round((last.revenue - prev.revenue)/prev.revenue*100);
      deltaHtml = `<div class="hero-delta ${pct>=0?'delta-up':'delta-down'}">${pct>=0?'↑':'↓'} ${Math.abs(pct)}% vs bulan lalu</div>`;
    }

    document.getElementById('hero-revenue').textContent = fmt(totalRev);
    document.getElementById('hero-revenue-sub').innerHTML = `${activeMonths} bulan aktif${deltaHtml}`;
    document.getElementById('hero-units').textContent = totalUnits + ' unit';
    document.getElementById('hero-units-sub').textContent = activeMonths ? `avg ${Math.round(totalUnits/activeMonths)} unit/bulan` : '—';
    document.getElementById('hero-avg').textContent = fmtShort(avgRev);
    document.getElementById('hero-avg-sub').textContent = activeMonths ? `dari ${activeMonths} bulan aktif` : '—';
  }

  function renderChart(data) {
    const wrap = document.getElementById('chart-wrap');
    if (!data.length) { wrap.innerHTML = '<div class="empty">Belum ada data penjualan.</div>'; return; }

    const W_per_group = 52;
    const PAD_L = 60, PAD_R = 20, PAD_T = 16, PAD_B = 40;
    const CHART_H = 220;
    const totalW = Math.max(600, PAD_L + data.length * W_per_group + PAD_R);

    const maxRev = Math.max(...data.map(d=>d.revenue), 1);
    const maxUnits = Math.max(...data.map(d=>d.units), 1);

    const revH = (v) => CHART_H - PAD_B - (v/maxRev)*(CHART_H-PAD_T-PAD_B);
    const unitH = (v) => CHART_H - PAD_B - (v/maxUnits)*(CHART_H-PAD_T-PAD_B);
    const barH = (v, max) => (v/max)*(CHART_H-PAD_T-PAD_B);

    // Y axis labels (revenue)
    let yLabels = '';
    for (let i=0; i<=4; i++) {
      const val = Math.round(maxRev * i/4);
      const y = CHART_H - PAD_B - (i/4)*(CHART_H-PAD_T-PAD_B);
      yLabels += `<text x="${PAD_L-8}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--text3)">${fmtShort(val)}</text>`;
      yLabels += `<line x1="${PAD_L}" y1="${y}" x2="${totalW-PAD_R}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,4"/>`;
    }

    // Bars + x labels
    let bars = '';
    data.forEach((d, i) => {
      const x = PAD_L + i * W_per_group + W_per_group/2;
      const bw = 14;
      const gap = 3;

      const rh = barH(d.revenue, maxRev);
      const uh = barH(d.units, maxUnits);

      bars += `<g class="bar-group" data-idx="${i}"
        onmouseenter="showTooltip(event,${i})"
        onmouseleave="hideTooltip()">
        <rect class="bar-revenue" x="${x-bw-gap/2}" y="${CHART_H-PAD_B-rh}" width="${bw}" height="${Math.max(rh,1)}" fill="var(--green)" rx="2" opacity="0.85"/>
        <rect class="bar-units" x="${x+gap/2}" y="${CHART_H-PAD_B-uh}" width="${bw}" height="${Math.max(uh,1)}" fill="var(--yellow)" rx="2" opacity="0.7"/>
        <text x="${x}" y="${CHART_H-PAD_B+14}" text-anchor="middle" font-size="9" fill="var(--text3)">${BULAN[parseInt(d.month.split('-')[1])-1]}</text>
        <text x="${x}" y="${CHART_H-PAD_B+24}" text-anchor="middle" font-size="8" fill="var(--text3)" opacity="0.6">${d.month.slice(2,4)}</text>
        <rect x="${PAD_L + i*W_per_group}" y="${PAD_T}" width="${W_per_group}" height="${CHART_H-PAD_T-PAD_B}" fill="transparent"/>
      </g>`;
    });

    wrap.innerHTML = `<svg class="chart-svg" width="${totalW}" height="${CHART_H}" viewBox="0 0 ${totalW} ${CHART_H}">
      ${yLabels}
      <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${CHART_H-PAD_B}" stroke="var(--border)"/>
      <line x1="${PAD_L}" y1="${CHART_H-PAD_B}" x2="${totalW-PAD_R}" y2="${CHART_H-PAD_B}" stroke="var(--border)"/>
      ${bars}
    </svg>`;

    // store data for tooltip
    wrap._chartData = data;
  }

  function showTooltip(e, idx) {
    const data = document.getElementById('chart-wrap')._chartData;
    if (!data) return;
    const d = data[idx];
    const tt = document.getElementById('tooltip');
    const artikelLines = Object.entries(d.byArtikel).map(([name, v]) =>
      `<div class="tt-row"><span class="tt-label">${name}</span><span class="tt-val" style="color:var(--text2);">${v.units}u</span></div>`
    ).join('');
    tt.innerHTML = `
      <div class="tt-month">${fmtMonth(d.month)}</div>
      <div class="tt-row"><span class="tt-label">Revenue</span><span class="tt-val" style="color:var(--green);">${fmt(d.revenue)}</span></div>
      <div class="tt-row"><span class="tt-label">Unit Terjual</span><span class="tt-val" style="color:var(--yellow);">${d.units}</span></div>
      ${artikelLines ? `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">${artikelLines}</div>` : ''}
    `;
    tt.classList.add('show');
    tt.style.left = (e.clientX + 16) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  }
  function hideTooltip() { document.getElementById('tooltip').classList.remove('show'); }

  function renderTable(data) {
    const wrap = document.getElementById('table-wrap');
    if (!data.length) { wrap.innerHTML = '<div class="empty">Belum ada data.</div>'; return; }

    const maxRev = Math.max(...data.map(d=>d.revenue), 1);
    const totalRev = data.reduce((s,d)=>s+d.revenue,0);
    const totalUnits = data.reduce((s,d)=>s+d.units,0);

    const rows = [...data].reverse().map(d => {
      const barPct = Math.round(d.revenue/maxRev*100);
      const artikelTags = Object.keys(d.byArtikel).map(n=>`<span class="tag-artikel">${n}: ${d.byArtikel[n].units}</span>`).join(' ');
      return `<tr>
        <td style="font-weight:500;">${fmtMonth(d.month)}</td>
        <td class="right mono" style="color:var(--green);">${fmt(d.revenue)}
          <div class="bar-mini" style="width:${barPct}%;max-width:80px;margin-left:auto;"></div>
        </td>
        <td class="right mono" style="color:var(--yellow);">${d.units}</td>
        <td class="right" style="color:var(--text2);">${d.revenue && d.units ? fmt(Math.round(d.revenue/d.units)) : '—'}</td>
        <td>${artikelTags || '<span style="color:var(--text3);">—</span>'}</td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table>
      <thead>
        <tr>
          <th>Bulan</th>
          <th class="right">Revenue</th>
          <th class="right">Unit</th>
          <th class="right">Avg/Unit</th>
          <th>Per Artikel</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td style="color:var(--text3);">Total</td>
          <td class="right mono" style="color:var(--green);">${fmt(totalRev)}</td>
          <td class="right mono" style="color:var(--yellow);">${totalUnits}</td>
          <td class="right mono" style="color:var(--text2);">${totalUnits ? fmt(Math.round(totalRev/totalUnits)) : '—'}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>`;
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
